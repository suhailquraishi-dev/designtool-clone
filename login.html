<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>FrameUp</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script>
    // This build has no login page. Send visitors on to where they were going
    // (same site only), or the home page.
    (() => {
      let target = 'index.html';
      try {
        const url = new URL(new URLSearchParams(window.location.search).get('redirect') || 'index.html', window.location.href);
        if (url.origin === window.location.origin && !/\/login\.html$/i.test(url.pathname)) {
          target = url.pathname.replace(/^\//, '') + url.search + url.hash || 'index.html';
        }
      } catch (error) {
        target = 'index.html';
      }
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p><a href="index.html">Continue to FrameUp</a></p>
</body>
</html>
